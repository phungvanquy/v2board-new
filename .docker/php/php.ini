; FPM overrides — distinct from cli-php.ini (which is for Workerman)
; Keep this lean and production-sane; Workerman continues to use cli-php.ini

memory_limit = 512M
max_execution_time = 30
max_input_time = 300
post_max_size = 560M
upload_max_filesize = 520M
max_file_uploads = 20
expose_php = Off
default_charset = "UTF-8"
cgi.fix_pathinfo = 1
file_uploads = On
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60
variables_order = "GPCS"
request_order = "GP"
precision = 14
serialize_precision = -1
enable_dl = Off

; Error handling — show nothing in prod, log to stderr (docker logs)
display_errors = Off
display_startup_errors = Off
log_errors = On
; Laravel 8 + modern PHP emits third-party deprecation noise; keep real errors
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
html_errors = Off
ignore_repeated_errors = Off
ignore_repeated_source = Off

; OPcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.save_comments = 0
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; V2Board writes PHP files at runtime and re-reads them in the same request:
;   ConfigController::save()  -> config/v2board.php   then Artisan::call('config:cache')
;   ThemeService::init()      -> config/theme/*.php   then Artisan::call('config:cache')
;   ConfigController::save()  -> bootstrap/cache/config.php
; With validate_timestamps=0 / enable_file_override=1 the freshly written file is
; served from the stale opcode cache, so config:cache re-bakes the OLD values and
; the admin UI reports "saved" while a refresh shows the previous settings.
; Revalidate every access instead (stat() per file; negligible vs. correctness).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.file_update_protection = 0
opcache.enable_file_override = 0

; Redis / igbinary are enabled via docker-php-ext-enable (creates their ini)

[curl]
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

[openssl]
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
