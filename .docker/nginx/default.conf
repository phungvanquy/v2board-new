server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    # Security: hide dotfiles except .well-known
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ /\.well-known { allow all; }

    # Health probe — nginx-only, does not hit PHP
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Static assets — serve directly, long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Public storage symlink target
    location /storage/ {
        try_files $uri =404;
        access_log off;
    }

    # All other requests → Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Deny access to sensitive locations
    location ~* ^/(storage|bootstrap|config|database|resources|routes)/ { deny all; }
}
