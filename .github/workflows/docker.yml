name: docker

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .docker/**
      - config/**
      - app/**
      - database/**
      - docker-compose.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/v2board-app
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/v2board-nginx
  PHP_VERSION: '8.2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "app_image=ghcr.io/${OWNER_LC}/v2board-app" >> "$GITHUB_OUTPUT"
          echo "nginx_image=ghcr.io/${OWNER_LC}/v2board-nginx" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app image (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            WITH_WEBMAN=true
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.meta.outputs.app_image }}:${{ steps.meta.outputs.version || 'pr-check' }}
            ${{ steps.meta.outputs.version && format('{0}:latest', steps.meta.outputs.app_image) || '' }}

      - name: Build nginx image (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.meta.outputs.nginx_image }}:${{ steps.meta.outputs.version || 'pr-check' }}
            ${{ steps.meta.outputs.version && format('{0}:latest', steps.meta.outputs.nginx_image) || '' }}
